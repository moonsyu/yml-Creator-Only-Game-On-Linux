name: Deploy web generator to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify generators and mod installer
        working-directory: code
        run: |
          node --test
          python3 -B -m unittest discover -s test -p 'test_*.py'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static web files
        run: |
          mkdir -p static-pages
          cp code/index.html static-pages/index.html
          cp code/styles.css static-pages/styles.css
          cp code/app.js static-pages/app.js
          cp code/valheim-mods.js code/valheim-installer-source.js static-pages/
          cp -r code/vendor static-pages/vendor

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
