name: Deploy web generator to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify generators and mod installer
        working-directory: code
        run: |
          node --test
          python3 -B -m unittest discover -s test -p 'test_*.py'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static web files
        run: |
          mkdir -p static-pages
          cp code/index.html static-pages/index.html
          cp code/styles.css static-pages/styles.css
          cp code/app.js static-pages/app.js
          cp code/valheim-mods.js code/valheim-qol.js code/valheim-settings.js code/valheim-mbround.js code/valheim-installer-source.js code/image-catalog.js code/help-palworld.js code/help-palworld-ops.js code/help-valheim-corekeeper.js static-pages/
          cp -r code/vendor static-pages/vendor
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const file = 'static-pages/index.html';
          const html = fs.readFileSync(file, 'utf8').replace(/(src|href)="([^":?]+\.(?:js|css))"/g, (_, attr, asset) => {
            const hash = crypto.createHash('sha256').update(fs.readFileSync(`static-pages/${asset}`)).digest('hex').slice(0, 12);
            return `${attr}="${asset}?v=${hash}"`;
          });
          fs.writeFileSync(file, html);
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: static-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
