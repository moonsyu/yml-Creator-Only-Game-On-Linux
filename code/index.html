<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 서버 YML 생성기</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>게임 서버 YML 생성기</h1>
            <p>Palworld와 Core Keeper 전용 Docker Compose 설정 파일을 구성하세요.</p>
        </header>

        <main class="app-main">
            <section class="section-container" id="section-game">
                <h2>1. 게임 선택</h2>
                <p class="section-desc">Docker Compose 파일을 생성할 게임을 선택해주세요.</p>
                <div class="creator-cards">
                    <button class="creator-card game-card active" data-game="palworld" aria-label="Palworld 선택" aria-pressed="true">
                        <div class="card-icon">🐾</div>
                        <div class="card-content">
                            <h3>Palworld</h3>
                            <p>Palworld 전용 서버 Compose 생성</p>
                        </div>
                    </button>
                    <button class="creator-card game-card" data-game="corekeeper" aria-label="Core Keeper 선택" aria-pressed="false">
                        <div class="card-icon">⛏️</div>
                        <div class="card-content">
                            <h3>Core Keeper</h3>
                            <p>Core Keeper 전용 서버 Compose 생성</p>
                        </div>
                    </button>
                </div>
                <div class="action-bar" id="action-game"></div>
            </section>

            <section class="section-container" id="section-creator"></section>

            <section class="section-container" id="section-connection">
            </section>

            <section class="section-container placeholder-section" id="section-options">
                <h2>4. 서버 옵션</h2>
            </section>

            <section class="section-container" id="section-actions">
                <h2>5. YML 미리보기</h2>
                
                <div class="volume-settings">
                    <div id="volume-settings-fields"></div>
                    <div class="action-bar" id="action-volume"></div>
                </div>

                <div class="form-divider" style="margin: var(--spacing-lg) 0;"></div>

                <div class="local-storage-area" id="local-storage-area">
                    <div class="form-group">
                        <label>로컬 저장소 (데스크톱 전용) <span class="hint-wrapper"><button type="button" class="hint-icon" aria-label="로컬 저장소 도움말" aria-expanded="false">?</button><span class="hint-tooltip" role="tooltip">현재 설정한 상태를 앱 내부(로컬)에 저장하여 나중에도 불러올 수 있게 합니다.</span></span></label>
                        <p class="helper-text">현재 작성한 설정을 로컬 데스크톱에 저장하거나 불러올 수 있습니다.</p>
                        <div style="display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-sm); flex-wrap: wrap;">
                            <button type="button" id="btn-local-save" class="btn btn-primary">로컬 저장</button>
                            <button type="button" id="btn-local-load" class="btn btn-secondary">저장값 불러오기</button>
                            <button type="button" id="btn-local-reset" class="btn btn-danger">저장값 삭제</button>
                        </div>
                        <p id="local-storage-status" class="helper-text" style="margin-top: var(--spacing-sm); min-height: 1.2em;"></p>
                    </div>
                    <div class="form-divider" style="margin: var(--spacing-lg) 0;"></div>
                </div>

                <div class="global-actions" style="gap: var(--spacing-sm); display: flex; align-items: center; justify-content: flex-end;">
                    <div style="display: inline-flex; align-items: center;">
                        <button type="button" id="btn-download-yml" class="btn btn-primary">YML 다운로드</button>
                        <span class="hint-wrapper" style="margin-left: 8px;">
                            <button type="button" class="hint-icon" aria-label="YML 다운로드 도움말" aria-expanded="false">?</button>
                            <span class="hint-tooltip" role="tooltip">작성된 docker-compose.yml 파일을 저장합니다.</span>
                        </span>
                    </div>
                    <div style="display: inline-flex; align-items: center;">
                        <button type="button" id="btn-reset-all" class="btn btn-danger">전체 초기화</button>
                        <span class="hint-wrapper" style="margin-left: 8px;">
                            <button type="button" class="hint-icon" aria-label="전체 초기화 도움말" aria-expanded="false">?</button>
                            <span class="hint-tooltip" role="tooltip">현재까지 작성한 모든 설정을 기본값으로 되돌립니다.</span>
                        </span>
                    </div>
                </div>
                <p id="download-status" class="helper-text" style="text-align: right; margin-top: -var(--spacing-md); margin-bottom: var(--spacing-lg); min-height: 1.2em;"></p>

                <div class="yml-output-container">
                    <pre><code id="yml-output"></code></pre>
                </div>
            </section>
        </main>
    </div>
    
    <script src="app.js" defer></script>
</body>
</html>
